[package]
name = "open-rpa-studio"
version = "0.1.30"
description = "Independent local-first RPA workflow studio"
authors = ["Open RPA Studio contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_rpa_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
