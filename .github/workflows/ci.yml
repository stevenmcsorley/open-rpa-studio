name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked Python development dependencies
        run: uv sync --locked --extra dev
      - name: Python engine tests
        run: uv run --locked --extra dev pytest -q
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Production frontend build
        run: npm run build
      - name: Check Windows desktop host
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
