name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked Python development dependencies
        run: uv sync --locked --extra dev --extra ocr --extra browser --extra desktop --extra credentials
      - name: Install Playwright Chromium runtime
        run: uv run --locked --extra browser python -m playwright install chromium
      - name: Python engine tests
        run: uv run --locked --extra dev pytest -q
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Production frontend build
        run: npm run build
      - name: Build bundled Python bridge for the Tauri resource check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources, .build/pyinstaller | Out-Null
          uv run --locked --extra browser --extra desktop --extra credentials --extra ocr pyinstaller `
            --noconfirm --clean --onefile --name openrpa-bridge `
            --distpath src-tauri/resources --workpath .build/pyinstaller --specpath .build/pyinstaller `
            --paths . --collect-submodules openrpa --collect-all regex `
            --collect-all playwright --collect-all pyautogui --collect-all keyring --collect-all openpyxl --collect-all defusedxml --collect-all PIL `
            scripts/bridge_entry.py
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item -LiteralPath src-tauri/resources/openrpa-bridge.exe -Destination "src-tauri/resources/openrpa-bridge-$version.exe"
      - name: Check bundled CLI/MCP command
        shell: pwsh
        run: |
          src-tauri/resources/openrpa-bridge.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'The bundled CLI/MCP command failed its startup check.' }
          uv run --locked python tests/fixtures/packaged_mcp_acceptance.py src-tauri/resources/openrpa-bridge.exe
          uv run --locked python tests/fixtures/packaged_ocr_acceptance.py src-tauri/resources/openrpa-bridge.exe
          uv run --locked python tests/fixtures/packaged_web_table_acceptance.py src-tauri/resources/openrpa-bridge.exe
      - name: Check Windows desktop host
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
