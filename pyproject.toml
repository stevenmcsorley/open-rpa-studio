[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rpa-studio-engine"
version = "0.1.130"
description = "Local-first visual automation workflow engine"
requires-python = ">=3.11"
dependencies = ["regex>=2024.11,<2027", "openpyxl>=3.1,<4", "defusedxml>=0.7.1,<1", "pypdf>=6.19,<7", "tzdata>=2025.2,<2027", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "pyinstaller>=6.10,<7"]
browser = ["playwright>=1.50,<2"]
desktop = [
    "pyautogui>=0.9.54,<1",
    "python-xlib>=0.33,<1 ; sys_platform == 'linux'",
    "pywinauto>=0.6.9,<1 ; sys_platform == 'win32'",
]
credentials = ["keyring>=25,<27"]
ocr = ["Pillow>=10,<13"]

[project.scripts]
openrpa = "openrpa.cli:main"

[tool.setuptools.packages.find]
include = ["openrpa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
